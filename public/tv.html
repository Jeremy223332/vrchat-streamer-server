<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRChat TV Receiver</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 165, 0, 0.85);
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="status" class="status-badge">listening for stream..</div>
    <video id="video-player" controls autoplay muted playsinline></video>

    <script>
        const video = document.getElementById('video-player');
        const statusBadge = document.getElementById('status');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        let hls = null;

        function loadStream() {
            const streamUrl = '/stream/index.m3u8?' + new Date().getTime(); // Prevents caching stale segments

            if (Hls.isSupported()) {
                if (hls) hls.destroy();

                hls = new Hls({
                    maxBufferLength: 5,
                    liveSyncDuration: 2,
                    manifestLoadingTimeOut: 10000,
                    manifestLoadingMaxRetry: 10
                });

                hls.loadSource(streamUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay waiting for interaction:", e));
                    statusBadge.style.background = 'rgba(0, 255, 204, 0.85)';
                    statusBadge.textContent = 'STREAM LIVE';
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.log("HLS Fatal error, retrying in 3 seconds...", data);
                        statusBadge.style.background = 'rgba(255, 165, 0, 0.85)';
                        statusBadge.textContent = 'Buffering stream...';
                        setTimeout(loadStream, 3000);
                    }
                });
            } 
            // Native HLS support fallback (Safari / iOS)
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log("Autoplay waiting for interaction:", e));
                    statusBadge.style.background = 'rgba(0, 255, 204, 0.85)';
                    statusBadge.textContent = 'STREAM LIVE';
                });
            }
        }

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'STREAM_START') {
                    statusBadge.textContent = 'Loading video stream...';
                    setTimeout(loadStream, 2000); // Wait 2s for initial FFmpeg segments
                }
            } catch (e) {}
        };
    </script>
</body>
</html>

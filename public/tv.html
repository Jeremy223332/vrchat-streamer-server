<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRChat TV Receiver</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #video-player {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 165, 0, 0.85);
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="status" class="status-badge">LISTENING FOR STREAM</div>
    <video id="video-player" controls autoplay muted playsinline></video>

    <script>
        const video = document.getElementById('video-player');
        const statusBadge = document.getElementById('status');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        let hls = null;

        function startHlsStream() {
            // Append timestamp to prevent cached segments
            const streamUrl = '/stream/index.m3u8?t=' + Date.now();

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }

                hls = new Hls({
                    maxBufferLength: 3,
                    liveSyncDuration: 1,
                    manifestLoadingTimeOut: 5000,
                    manifestLoadingMaxRetry: 5
                });

                hls.loadSource(streamUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().then(() => {
                        statusBadge.style.background = 'rgba(0, 255, 204, 0.85)';
                        statusBadge.textContent = 'STREAM LIVE';
                    }).catch(err => {
                        console.log("Autoplay blocked, click video to un-mute", err);
                        statusBadge.textContent = 'CLICK VIDEO TO PLAY';
                    });
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        statusBadge.style.background = 'rgba(255, 165, 0, 0.85)';
                        statusBadge.textContent = 'BUFFERING STREAM...';
                        setTimeout(startHlsStream, 2000);
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.play();
                statusBadge.style.background = 'rgba(0, 255, 204, 0.85)';
                statusBadge.textContent = 'STREAM LIVE';
            }
        }

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'STREAM_START') {
                    statusBadge.textContent = 'INITIALIZING STREAM...';
                    setTimeout(startHlsStream, 3000);
                }
            } catch (e) {}
        };
    </script>
</body>
</html>

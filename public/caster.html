<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Caster</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #00ffcc;
        }
        .display-box {
            width: 100%;
            height: 100px;
            background-color: #000000;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: #888888;
            margin-bottom: 20px;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 14px 28px;
            background-color: #00ffcc;
            color: #000000;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #00cca3;
        }
        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
        .stop-btn {
            background-color: #ff4444;
            color: white;
        }
        .stop-btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Classroom Screen Caster</h1>

        <div id="tv-status" class="display-box">
            Connecting to server...
        </div>

        <div class="controls">
            <button id="start-screen-btn" type="button">Share & Cast Screen</button>
            <button id="stop-screen-btn" type="button" class="stop-btn" style="display: none;">Stop Sharing</button>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('start-screen-btn');
        const stopBtn = document.getElementById('stop-screen-btn');
        const tvStatus = document.getElementById('tv-status');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        let mediaRecorder = null;
        let localStream = null;

        ws.onopen = () => {
            tvStatus.textContent = 'Ready to share screen!';
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'STATUS') {
                    tvStatus.textContent = data.message;
                }
            } catch (err) {}
        };

        ws.onerror = () => {
            tvStatus.textContent = 'WebSocket Connection Error!';
        };

        startBtn.addEventListener('click', async () => {
            try {
                // Prompt user to pick Entire Screen, Window, or Chrome Tab
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: 30 },
                    audio: true
                });

                tvStatus.textContent = 'Screen capture active. Transcoding to VRChat...';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';

                // Stream video chunks over WebSockets to Render
                mediaRecorder = new MediaRecorder(localStream, { mimeType: 'video/webm;codecs=vp8,opus' });

                ws.send(JSON.stringify({ type: 'START_SCREEN_CAST' }));

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0 && ws.readyState === WebSocket.OPEN) {
                        ws.send(e.data);
                    }
                };

                mediaRecorder.start(500); // Send slice every 500ms

                // Handle user clicking "Stop Sharing" on Chrome's floating bar
                localStream.getVideoTracks()[0].onended = () => {
                    stopCasting();
                };

            } catch (err) {
                console.error("Screen share canceled or failed:", err);
                tvStatus.textContent = 'Screen share canceled.';
            }
        });

        stopBtn.addEventListener('click', () => {
            stopCasting();
        });

        function stopCasting() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'STOP_SCREEN_CAST' }));
            }
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            tvStatus.textContent = 'Screen sharing stopped.';
        }
    </script>
</body>
</html>

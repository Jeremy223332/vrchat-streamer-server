<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Caster</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #00ffcc;
        }
        .display-box {
            width: 100%;
            height: 100px;
            background-color: #000000;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: #888888;
            margin-bottom: 20px;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .section-title {
            color: #00ffcc;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 1rem;
        }
        button {
            padding: 12px 20px;
            background-color: #00ffcc;
            color: #000000;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #00cca3;
        }
        .full-width-btn {
            width: 100%;
            padding: 14px;
        }
        .stop-btn {
            background-color: #ff4444;
            color: white;
        }
        .stop-btn:hover {
            background-color: #cc0000;
        }
        hr {
            border: 0;
            height: 1px;
            background: #333;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Classroom Caster Controller</h1>

        <div id="tv-status" class="display-box">
            Connecting to server...
        </div>

        <!-- Option 1: Share Screen -->
        <div class="section-title">Option 1: Desktop / Tab Screen Share</div>
        <div style="margin-bottom: 20px;">
            <button id="start-screen-btn" class="full-width-btn" type="button">Share & Cast Entire Screen</button>
            <button id="stop-screen-btn" class="full-width-btn stop-btn" type="button" style="display: none;">Stop Screen Sharing</button>
        </div>

        <hr>

        <!-- Option 2: Stream URL -->
        <div class="section-title">Option 2: Direct Stream / Video Link</div>
        <div class="controls">
            <input type="text" id="url-input" placeholder="Paste direct .m3u8 or video URL..." />
            <button id="cast-url-btn" type="button">Cast Link</button>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('start-screen-btn');
        const stopBtn = document.getElementById('stop-screen-btn');
        const castUrlBtn = document.getElementById('cast-url-btn');
        const urlInput = document.getElementById('url-input');
        const tvStatus = document.getElementById('tv-status');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        let mediaRecorder = null;
        let localStream = null;

        ws.onopen = () => {
            tvStatus.textContent = 'Ready to cast screen or link!';
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'STATUS') {
                    tvStatus.textContent = data.message;
                } else if (data.type === 'STREAM_START') {
                    tvStatus.textContent = 'Streaming live to classroom screen!';
                }
            } catch (err) {}
        };

        ws.onerror = () => {
            tvStatus.textContent = 'WebSocket Connection Error!';
        };

        // --- SCREEN CAPTURE LOGIC ---
        startBtn.addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: 30 },
                    audio: true
                });

                tvStatus.textContent = 'Screen capture active. Transcoding to VRChat...';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';

                mediaRecorder = new MediaRecorder(localStream, { mimeType: 'video/webm;codecs=vp8,opus' });

                ws.send(JSON.stringify({ type: 'START_SCREEN_CAST' }));

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0 && ws.readyState === WebSocket.OPEN) {
                        ws.send(e.data);
                    }
                };

                mediaRecorder.start(500);

                localStream.getVideoTracks()[0].onended = () => {
                    stopCasting();
                };

            } catch (err) {
                console.error("Screen share canceled:", err);
                tvStatus.textContent = 'Screen share canceled.';
            }
        });

        stopBtn.addEventListener('click', () => {
            stopCasting();
        });

        function stopCasting() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'STOP_SCREEN_CAST' }));
            }
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
            tvStatus.textContent = 'Screen sharing stopped.';
        }

        // --- URL CAST LOGIC ---
        castUrlBtn.addEventListener('click', () => {
            const targetUrl = urlInput.value.trim();
            if (!targetUrl) return;

            // Stop screen share if actively running
            if (localStream) {
                stopCasting();
            }

            tvStatus.textContent = "Casting URL stream...";

            fetch('/api/cast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: targetUrl })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    tvStatus.textContent = "Streaming link live to classroom screen!";
                }
            })
            .catch(err => {
                console.error("Cast request failed:", err);
                tvStatus.textContent = "Failed to start stream.";
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Caster</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #00ffcc;
        }
        .display-box {
            width: 100%;
            height: 100px;
            background-color: #000000;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: #888888;
            margin-bottom: 20px;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 1rem;
        }
        button {
            padding: 12px 24px;
            background-color: #00ffcc;
            color: #000000;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #00cca3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Classroom Caster Controller</h1>

        <div id="tv-status" class="display-box">
            Connecting to server...
        </div>

        <div class="controls">
            <input type="text" id="url-input" placeholder="Enter video or stream URL..." />
            <button id="cast-btn" type="button">Cast to Screen</button>
        </div>
    </div>

    <script>
        const castBtn = document.getElementById('cast-btn');
        const urlInput = document.getElementById('url-input');
        const tvStatus = document.getElementById('tv-status');

        // Dynamic WebSocket connection setup
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        ws.onopen = () => {
            console.log('Connected to WebSocket server');
            tvStatus.textContent = 'Waiting for stream input...';
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'STATUS') {
                    tvStatus.textContent = data.message;
                } else if (data.type === 'STREAM_START') {
                    tvStatus.textContent = 'Streaming live to classroom screen!';
                }
            } catch (err) {
                console.log('Message from server:', event.data);
            }
        };

        ws.onerror = (error) => {
            console.error('WebSocket Error:', error);
            tvStatus.textContent = 'WebSocket Connection Error!';
        };

        ws.onclose = () => {
            console.log('WebSocket disconnected');
            tvStatus.textContent = 'Disconnected from server. Retrying...';
        };

        // Cast action
        castBtn.addEventListener('click', () => {
            const targetUrl = urlInput.value.trim();
            if (!targetUrl) return;

            tvStatus.textContent = "Casting to screen...";

            fetch('/api/cast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: targetUrl })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    tvStatus.textContent = "Streaming live to classroom screen!";
                }
            })
            .catch(err => {
                console.error("Cast request failed:", err);
                tvStatus.textContent = "Failed to start stream.";
            });
        });
    </script>
</body>
</html>

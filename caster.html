<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VRChat Screen Caster</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
    button { padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; background: #0088cc; color: #fff; border: none; border-radius: 4px; }
    #status { margin-top: 15px; font-weight: bold; color: #ffcc00; }
  </style>
</head>
<body>
  <h2>VRChat Screen Broadcaster</h2>
  <p>Select a <b>specific window or tab</b> to share.</p>
  
  <button id="startBtn">Start Screen Capture</button>
  <button id="stopBtn" disabled>Stop Capture</button>
  <div id="status">Status: Idle</div>

  <script>
    let mediaRecorder = null;
    let ws = null;
    let stream = null;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');

    startBtn.onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: { width: 1280, height: 720, frameRate: 30 },
          audio: true
        });

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}`);

        ws.onopen = () => {
          status.innerText = 'Status: Connected! Streaming live...';
          
          // Request keyframes every 1000ms (1 second) to keep FFmpeg synced continuously
          mediaRecorder = new MediaRecorder(stream, { 
            mimeType: 'video/webm;codecs=vp8,opus',
            videoBitsPerSecond: 2500000 
          });
          
          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0 && ws.readyState === WebSocket.OPEN) {
              ws.send(event.data);
            }
          };

          mediaRecorder.start(1000); // Send slice every 1 second
          startBtn.disabled = true;
          stopBtn.disabled = false;
        };

        ws.onerror = () => {
          status.innerText = 'WebSocket Connection Error!';
        };

        stream.getVideoTracks()[0].onended = () => {
          stopCapture();
        };

      } catch (err) {
        status.innerText = 'Error: ' + err.message;
      }
    };

    stopBtn.onclick = stopCapture;

    function stopCapture() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (ws) ws.close();
      if (stream) stream.getTracks().forEach(track => track.stop());
      startBtn.disabled = false;
      stopBtn.disabled = true;
      status.innerText = 'Status: Stopped';
    }
  </script>
</body>
</html>
